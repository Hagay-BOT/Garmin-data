name: Update Garmin Dashboard

on:
  schedule:
    # 3x/day — 06:00, 14:00, 22:00 UTC (09:00, 17:00, 01:00 Israel time)
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

# מושך נתונים מגרמין ושומר ל-data.json בלבד. את פרסום ה-Pages עושה deploy.yml
# (שמופעל אוטומטית כש-update מסתיים, דרך workflow_run) — כך אין שני deploy מקבילים
# שמתנגשים ("in progress deployment" 400). 29.06: ההתנגשות הזו הפילה את update.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Garmin data
        run: python fetch_garmin.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Commit data.json
        run: |
          bash scripts/git_sync.sh "chore: update running data $(date -u +%Y-%m-%d)" \
            data.json
