name: 🛑 Approve Week (unified)

# הפעלה ידנית = האישור השבועי המאוחד שלך.
# פעולה אחת: נועל את התוכנית + מעדכן יומן + דוחף לגרמין — ביחד.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm week — lock + calendar + Garmin (unified)
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python confirm_week.py

      - name: Commit locked plan + calendar + workout ids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week_plan.json calendar/training.ics created_workouts.json
          git diff --staged --quiet && echo "no changes" || git commit -m "approve-week: locked plan + calendar + Garmin $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
