name: 🛑 Approve Week (unified)

# הפעלה ידנית = האישור השבועי המאוחד שלך.
# פעולה אחת: נועל את התוכנית + מעדכן יומן + דוחף לגרמין — ביחד.
on:
  workflow_dispatch:
    inputs:
      resync:
        description: "נקה את גרמין לפני הדחיפה (אחרי שינוי תוכנית) — פעולה אחת במקום cleanup+approve"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm week — lock + calendar + Garmin (unified)
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          RESYNC: ${{ github.event.inputs.resync }}
        run: python confirm_week.py

      - name: Commit locked plan + calendar + workout ids
        run: |
          bash scripts/git_sync.sh "approve-week: locked plan + calendar + Garmin $(date -u +%Y-%m-%d)" \
            week_plan.json calendar/training.ics created_workouts.json
