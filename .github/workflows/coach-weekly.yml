name: Coach — Weekly Review

on:
  schedule:
    # שבת 20:30 Israel (IDT, UTC+3) = 17:30 UTC — סוף שבוע אימונים
    - cron: '30 17 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'בדיקה — שולח דוח לטלגרם אבל לא כותב/קובע תוכנית, לא commit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Garmin data (full week)
        run: python fetch_garmin.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Run weekly review (high effort — full plan)
        run: python coach.py weekly < /dev/null
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEEKLY_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: Commit reports + history (skipped in dry-run)
        if: ${{ inputs.dry_run != true }}
        run: |
          bash scripts/git_sync.sh "coach: weekly review $(date -u +%Y-%m-%d)" \
            data.json coach_report.md coach_history.json week_plan.json weekly_state.json
