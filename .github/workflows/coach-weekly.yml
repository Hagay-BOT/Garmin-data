name: Coach — Weekly Review

on:
  schedule:
    # שבת 20:30 Israel (IDT, UTC+3) = 17:30 UTC — סוף שבוע אימונים
    - cron: '30 17 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Garmin data (full week)
        run: python fetch_garmin.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Run weekly review (high effort — full plan)
        run: python coach.py weekly < /dev/null
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit reports + history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json coach_report.md coach_history.json
          git diff --staged --quiet && echo "no changes" || git commit -m "coach: weekly review $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
