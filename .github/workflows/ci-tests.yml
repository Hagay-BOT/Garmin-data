name: Tests

# M1.1 guardrail: compile everything + run smoke tests on every push, so the
# message/parse failure classes that broke production can never ship silently again.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all modules
        run: python -m py_compile $(git ls-files '*.py')
      - name: Validate all workflow YAMLs
        run: |
          pip install pyyaml   # CI-only dep — not needed at runtime, so not in requirements.txt
          python - <<'EOF'
          import yaml, glob
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f, encoding='utf-8'))
          print('all workflow YAMLs valid')
          EOF
      - name: Telegram message smoke tests
        run: python test_telegram_messages.py
