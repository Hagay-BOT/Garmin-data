name: Schedule Strength Workouts (⚠️ deprecated — use Approve Week)

# T4/M7: מיותר לזרימה הרגילה — approve-week (confirm_week→push_week) כבר דוחף את
# כל אימוני-הכוח של התוכנית עם השם המפורט. הכלי הזה נשאר ידני-בלבד לשעת-חירום
# (re-push נקודתי). אל תריץ יחד עם approve-week — יוצר כפילות. יימחק ב-M7.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build | build-one | push-one | schedule-week | cleanup"
        required: false
        default: "build"
      push_key:
        description: "workout key for push-one (A/B/C)"
        required: false
        default: "B"
      cleanup_id:
        description: "workout id to delete (cleanup mode only)"
        required: false
        default: ""

jobs:
  strength:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build only (no credentials, no push)
        if: ${{ github.event.inputs.mode == 'build' }}
        run: python push_strength.py --build-only

      - name: Build one full workout (no credentials)
        if: ${{ github.event.inputs.mode == 'build-one' }}
        run: python push_strength.py --build-one "${{ github.event.inputs.push_key }}"

      - name: Push one full exercise-level workout to Garmin (test)
        if: ${{ github.event.inputs.mode == 'push-one' }}
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python push_strength.py --push-one "${{ github.event.inputs.push_key }}"

      - name: Schedule week to Garmin calendar
        if: ${{ github.event.inputs.mode == 'schedule-week' }}
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python push_strength.py --schedule-week

      - name: Cleanup a scheduled workout
        if: ${{ github.event.inputs.mode == 'cleanup' }}
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python push_strength.py --cleanup "${{ github.event.inputs.cleanup_id }}"
