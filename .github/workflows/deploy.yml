name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # דחיפות הבוט (GITHUB_TOKEN) לא מפעילות workflows אחרים — לכן push לבדו לא
  # מרענן את Pages כשהמאמן מעדכן data.json. workflow_run מפעיל deploy אחרי
  # שכל workflow שמעדכן נתונים מסתיים, כך שהאתר תמיד עדכני.
  workflow_run:
    workflows:
      - "Coach — Workout Watcher (event-driven, all day)"
      - "Coach — Morning Readiness"
      - "Coach — Morning Reply Check"
      - "Coach — Evening Cancellation Reply"
      - "Coach — Weekly Review"
      - "Calendar Weather Refresh"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
