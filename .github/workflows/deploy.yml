name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # deploy מתוזמן במרווחים קבועים (:15 ו-:45 בכל שעה) — 30 דק' זה מזה, אף פעם
  # לא מתנגשים. פרסום הנתונים שהבוט דחף (GITHUB_TOKEN לא מפעיל push) קורה תוך ≤30 דק'.
  #
  # למה לא workflow_run: הוא ירה deploy אחרי כל workflow (watcher כל 30 דק' + update +
  # weekly + calendar…). לפעמים שניים ברצף תוך שניות → התנגשות Pages בצד-שרת ("in
  # progress deployment" 400), גם עם concurrency. מרווחים קבועים פותרים את זה מהשורש.
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false (לא true!): מאפשר לכל deploy ל-Pages לסיים, ומעמיד את הבא בתור.
  # cancel-in-progress: true ביטל workflow באמצע deploy → נשאר deployment תקוע
  # בצד-שרת ש-400 את הריצה הבאה ("in progress deployment"). זו ההמלצה הרשמית של GitHub.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
