name: Coach — Morning Reply Check

on:
  schedule:
    # כל 15 דק' לאורך חלון הבוקר 06:30–10:30 ישראל (IDT) → 03:30–07:30 UTC (כל יום)
    - cron: '*/15 3-7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for Telegram reply
        run: python check_telegram_reply.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Commit state changes
        run: |
          bash scripts/git_sync.sh "coach: morning reply applied $(TZ=Asia/Jerusalem date +%Y-%m-%d)" \
            morning_state.json data.json created_workouts.json
