name: Coach — Weekly Plan Choice (A/B)

on:
  schedule:
    # שבת בערב אחרי הסיכום (20:30 IL): כל 15 דק' 20:45–22:30 IL → 17:45–19:30 UTC
    - cron: '45 17 * * 6'           # 20:45 IL
    - cron: '0,15,30,45 18 * * 6'   # 21:00–21:45 IL
    - cron: '0,15,30 19 * * 6'      # 22:00–22:30 IL
  workflow_dispatch:

permissions:
  contents: write

jobs:
  choice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll for A/B plan choice
        run: python check_weekly_choice.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit plan + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week_plan.json weekly_state.json coach_history.json 2>/dev/null || true
          git diff --staged --quiet && echo "no changes" || git commit -m "coach: weekly plan choice $(TZ=Asia/Jerusalem date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
