name: Coach — Post-Workout Analysis

on:
  schedule:
    # 20:00 Israel (IDT, UTC+3) = 17:00 UTC — אחרי האימון
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postworkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Garmin data (today's workout)
        run: python fetch_garmin.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Run post-workout analysis (medium effort)
        run: python coach.py postworkout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json postworkout_report.md
          git diff --staged --quiet && echo "no changes" || git commit -m "coach: post-workout analysis $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
