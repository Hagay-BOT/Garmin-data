name: Coach — Data Watcher (garmin sync · journal · readiness)

# ה-watcher השוטף: משיכת נתוני גרמין, קליטת הערות-יומן ואילוצי-זמינות מטלגרם,
# שער-מוכנות בבוקר, ובדיקת ביטול בערב. אין כאן קריאות-LLM (ניתוח-אחרי-אימון בוטל).

on:
  schedule:
    # IDT = UTC+3. צפוף בחלונות ריצה, חסכוני בשעות המתות.
    - cron: '0,30 4,5,6 * * *'        # 07:00–09:30 IL — חלון בוקר, כל 30 דק'
    - cron: '0 7-14 * * *'            # 10:00–17:00 IL — שעות מתות, כל שעה
    - cron: '0,30 15,16,17,18 * * *'  # 18:00–21:30 IL — חלון ערב, כל 30 דק'
    - cron: '0 19 * * *'              # 22:00 IL — סלוט אחרון (בדיקת ביטול)
  # טריגר חיצוני אמין: cron-job.org / Cloudflare Worker מפעילים דרך GitHub API.
  # מבטיח שהניתוח רץ גם כש-GitHub cron הפנימי מדלג (best-effort, לא אמין בשעות עומס).
  repository_dispatch:
    types: [run-analysis]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Garmin data
        run: python fetch_garmin.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Capture coach-journal notes from Telegram
        run: python capture_notes.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

# ניתוח-אחרי-אימון (LLM→טלגרם) בוטל 26.07 לבקשת הגיא — ההודעות לא סייעו והיו
# בעלות מיותרת. הנתונים המעניינים יוצגו בדשבורד במקום. ה-watcher נשאר: משיכת
# נתוני גרמין, קליטת הערות-יומן, שער-מוכנות בבוקר, ובדיקת ביטול בערב.
      - name: Readiness gate (morning only — quality/long day + low readiness → suggest swap)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%H)
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 10 ]; then
            python readiness_gate.py
          else
            echo "Not the morning window (now $HOUR) — skipping readiness gate"
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: End-of-day cancellation check (23:00 IL only, no run today)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%H)
          if [ "$HOUR" = "23" ]; then
            python evening_cancel_prompt.py
          else
            echo "Not the 23:00 slot (now $HOUR) — skipping cancellation check"
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit reports + state
        run: |
          bash scripts/git_sync.sh "coach: workout watcher $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')" \
            data.json evening_state.json run_cancellations.json journal.json weekly_state.json athlete_state.json
