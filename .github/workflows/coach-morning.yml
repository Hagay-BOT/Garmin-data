name: Coach — Morning Readiness

on:
  schedule:
    # 06:00 Israel (IDT, UTC+3) = 03:00 UTC — לפני האימון
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Garmin data (sleep / HRV / body battery)
        run: python fetch_garmin.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Run morning readiness check (low effort — credit-efficient)
        run: python coach.py morning
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json morning_report.md
          git diff --staged --quiet && echo "no changes" || git commit -m "coach: morning readiness $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
