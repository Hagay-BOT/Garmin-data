name: Coach — Morning Readiness

on:
  schedule:
    # כל יום 06:30–08:30 ישראל (IDT = UTC+3) → 03:30–05:30 UTC, כל 30 דק'
    - cron: '30 3 * * *'          # 06:30 IL
    - cron: '0,30 4,5 * * *'      # 07:00 · 07:30 · 08:00 · 08:30 IL
    # שישי + שבת — המשך עד 10:30 (שינה עד מאוחר)
    - cron: '0,30 6,7 * * 5,6'    # 09:00 · 09:30 · 10:00 · 10:30 IL
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if morning report already generated today
        id: dedup
        run: |
          TODAY=$(TZ=Asia/Jerusalem date +%Y-%m-%d)
          if [ -f morning_report.md ] && grep -q "$TODAY" morning_report.md; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Morning report already generated for $TODAY — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch latest Garmin data (sleep / HRV / body battery)
        if: steps.dedup.outputs.skip != 'true'
        run: python fetch_garmin.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

      - name: Check if user has woken up (sleep_end_time synced)
        if: steps.dedup.outputs.skip != 'true'
        id: wakecheck
        run: |
          TODAY=$(TZ=Asia/Jerusalem date +%Y-%m-%d)
          SLEEP_END=$(python3 -c "
          import json, sys
          today = '$TODAY'
          d = json.load(open('data.json'))
          print(d.get('daily', {}).get(today, {}).get('sleep_end_time', '') or '')
          " 2>/dev/null || echo "")
          if [ -z "$SLEEP_END" ]; then
            echo "awake=false" >> $GITHUB_OUTPUT
            echo "No sleep_end_time for $TODAY — not yet synced, skipping"
          else
            echo "awake=true" >> $GITHUB_OUTPUT
            echo "Awake since $SLEEP_END — running morning analysis"
          fi

      - name: Run morning readiness check
        if: steps.dedup.outputs.skip != 'true' && steps.wakecheck.outputs.awake == 'true'
        run: python coach.py morning
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_BUTTON_URL: ${{ secrets.TRIGGER_BUTTON_URL }}

      - name: Commit reports
        if: steps.dedup.outputs.skip != 'true' && steps.wakecheck.outputs.awake == 'true'
        run: |
          bash scripts/git_sync.sh "coach: morning readiness $(TZ=Asia/Jerusalem date +%Y-%m-%d)" \
            data.json morning_report.md morning_state.json
